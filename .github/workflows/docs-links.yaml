name: docs-links

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/content/**/*.md'
      - 'docs/lychee.toml'
      - '.github/workflows/docs-links.yaml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout kubara repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check external documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config docs/lychee.toml 'docs/content/**/*.md'
          lycheeVersion: v0.24.2
          fail: true
